<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login & Register - MiniShop</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body class="bg-light d-flex flex-column min-vh-100">

    <!-- Navigation Bar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html">MiniShop</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="products.html">Products</a></li>
                    <li class="nav-item"><a class="nav-link" href="about.html">About Us</a></li>
                    <li class="nav-item"><a class="nav-link" href="dashboard.html">Admin Dashboard</a></li>
                </ul>
                <div class="d-flex align-items-center">
                    <!-- <a href="cart.html" class="btn btn-warning position-relative">
                        <i class="bi bi-cart-fill"></i> Cart
                        <span id="cart-count" class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger">0</span>
                    </a> -->
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Content Form Container -->
    <div class="container my-auto py-5">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-5">
                <div class="card border-0 shadow-lg rounded-3">
                    <div class="card-body p-4 p-md-5">
                        
                        <!-- Toggle Tabs -->
                        <ul class="nav nav-pills nav-justified mb-4" id="authTabs" role="tablist">
                            <li class="nav-item" role="presentation">
                                <button class="nav-link active fw-bold" id="login-tab" data-bs-toggle="tab" data-bs-target="#login-pane" type="button" role="tab">Login</button>
                            </li>
                            <li class="nav-item" role="presentation">
                                <button class="nav-link fw-bold" id="register-tab" data-bs-toggle="tab" data-bs-target="#register-pane" type="button" role="tab">Register</button>
                            </li>
                        </ul>

                        <!-- Alert Box for Success/Error Notifications -->
                        <div id="authAlert" class="alert d-none" role="alert"></div>

                        <!-- Tab Content -->
                        <div class="tab-content" id="authTabsContent">
                            
                            <!-- 1. LOGIN FORM -->
                            <div class="tab-pane fade show active" id="login-pane" role="tabpanel">
                                <form id="loginForm" onsubmit="handleLogin(event)">
                                    <div class="mb-3">
                                        <label for="loginEmail" class="form-label fw-bold">Email Address</label>
                                        <div class="input-group">
                                            <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                                            <input type="email" id="loginEmail" class="form-control" placeholder="name@example.com" required>
                                        </div>
                                    </div>
                                    <div class="mb-3">
                                        <label for="loginPassword" class="form-label fw-bold">Password</label>
                                        <div class="input-group">
                                            <span class="input-group-text"><i class="bi bi-lock"></i></span>
                                            <input type="password" id="loginPassword" class="form-control" placeholder="Enter password" required>
                                        </div>
                                    </div>
                                    <button type="submit" class="btn btn-primary w-100 fw-bold py-2 mt-2">Login</button>
                                </form>
                            </div>

                            <!-- 2. REGISTER FORM -->
                            <div class="tab-pane fade" id="register-pane" role="tabpanel">
                                <form id="registerForm" onsubmit="handleRegister(event)">
                                    <div class="mb-3">
                                        <label for="registerName" class="form-label fw-bold">Full Name</label>
                                        <div class="input-group">
                                            <span class="input-group-text"><i class="bi bi-person"></i></span>
                                            <input type="text" id="registerName" class="form-control" placeholder="John Doe" required>
                                        </div>
                                    </div>
                                    <div class="mb-3">
                                        <label for="registerEmail" class="form-label fw-bold">Email Address</label>
                                        <div class="input-group">
                                            <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                                            <input type="email" id="registerEmail" class="form-control" placeholder="name@example.com" required>
                                        </div>
                                    </div>
                                    <div class="mb-3">
                                        <label for="registerPassword" class="form-label fw-bold">Password</label>
                                        <div class="input-group">
                                            <span class="input-group-text"><i class="bi bi-lock"></i></span>
                                            <input type="password" id="registerPassword" class="form-control" placeholder="Create password" required>
                                        </div>
                                    </div>
                                    <button type="submit" class="btn btn-success w-100 fw-bold py-2 mt-2">Create Account</button>
                                </form>
                            </div>

                        </div>

                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="bg-dark text-white text-center py-4 mt-auto">
        <div class="container">
            <p class="mb-1 fw-bold">MiniShop E-Commerce Project</p>
            <p class="small text-muted mb-0">&copy; 2026 MiniShop. All rights reserved.</p>
        </div>
    </footer>

    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script>
    // Shared Users list in LocalStorage (syncs with Admin Dashboard)
    let users = JSON.parse(localStorage.getItem('admin_users')) || [];
    const alertBox = document.getElementById('authAlert');

    // Helper function to display temporary status messages
    function showAlert(message, type = 'danger') {
        alertBox.className = `alert alert-${type}`;
        alertBox.textContent = message;
        alertBox.classList.remove('d-none');
    }

    // REGISTER LOGIC
    function handleRegister(e) {
        e.preventDefault();
        
        const name = document.getElementById('registerName').value.trim();
        const email = document.getElementById('registerEmail').value.trim().toLowerCase();
        const password = document.getElementById('registerPassword').value;

        // Check if user already exists
        const userExists = users.some(u => u.email.toLowerCase() === email);

        if (userExists) {
            showAlert('An account with this email already exists!');
            return;
        }

        // Create new user object with default 'customer' role
        const newUser = {
            id: Date.now(),
            name: name,
            email: email,
            password: password,
            role: 'customer' // New users are customers by default
        };

        // Save to LocalStorage
        users.push(newUser);
        localStorage.setItem('admin_users', JSON.stringify(users));

        // Feedback and reset
        showAlert('Account created successfully! You can now log in.', 'success');
        document.getElementById('registerForm').reset();

        // Switch to Login Tab
        const loginTab = new bootstrap.Tab(document.getElementById('login-tab'));
        setTimeout(() => loginTab.show(), 1000);
    }

    // LOGIN LOGIC
    function handleLogin(e) {
        e.preventDefault();

        const email = document.getElementById('loginEmail').value.trim().toLowerCase();
        const password = document.getElementById('loginPassword').value;

        // Retrieve registered users
        users = JSON.parse(localStorage.getItem('admin_users')) || [];

        // Authenticate User
        const validUser = users.find(u => u.email.toLowerCase() === email && u.password === password);

        if (validUser) {
            const userRole = validUser.role || 'customer'; // Fallback for older accounts missing a role

            // Save current logged in user details & role
            localStorage.setItem('currentUser', JSON.stringify({
                id: validUser.id,
                name: validUser.name,
                email: validUser.email,
                role: userRole
            }));

            showAlert('Login successful! Redirecting...', 'success');

            // Redirect based on role
            setTimeout(() => {
                if (userRole === 'admin') {
                    window.location.href = 'admin-dashboard.html'; // Assumes your admin file is named this
                } else {
                    window.location.href = 'index.html'; // Regular customers go to storefront
                }
            }, 1000);
        } else {
            showAlert('Invalid email or password. Please try again.');
        }
    }

    // Initialize Cart Counter Badge (Personalized for logged-in user)
    const activeUser = JSON.parse(localStorage.getItem('currentUser'));
    let totalCount = 0;
    
    if (activeUser) {
        // Fetch cart specific to this user's ID
        const cartKey = `cart_${activeUser.id}`;
        const cart = JSON.parse(localStorage.getItem(cartKey)) || [];
        totalCount = cart.reduce((sum, item) => sum + item.quantity, 0);
    } else {
        // Fallback for guest cart (optional)
        const cart = JSON.parse(localStorage.getItem('cart')) || [];
        totalCount = cart.reduce((sum, item) => sum + item.quantity, 0);
    }
    
    document.getElementById('cart-count').textContent = totalCount;
</script>
</body>
</html>
