<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Products - Mini E-Commerce</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body class="bg-light d-flex flex-column min-vh-100">

    <!-- Navigation Bar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand fw-bold" href="#">MiniShop</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                    <li class="nav-item"><a class="nav-link active" href="products.html">Products</a></li>
                    <li class="nav-item"><a class="nav-link" href="about.html">About Us</a></li>
                    <li class="nav-item"><a class="nav-link" href="dashboard.html">Admin Dashboard</a></li>
                </ul>
                <div class="d-flex align-items-center">
                    <div class="d-flex align-items-center">
                        <!-- Updated Link Button -->
                        <a href="auth.html" id="auth-btn" class="btn btn-outline-light me-3">Login / Register</a>
                        
                        <button type="button" class="btn btn-warning position-relative" data-bs-toggle="offcanvas" data-bs-target="#cartOffcanvas">
                            <i class="bi bi-cart-fill"></i> Cart
                            <span id="cart-count" class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger">0</span>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="container my-5">
        <h1 class="text-center fw-bold mb-4">Our Products</h1>
        
        <!-- Search, Filter, and Sort Controls -->
        <div class="row mb-4 g-3">
            <div class="col-md-4">
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-search"></i></span>
                    <input type="text" id="searchInput" class="form-control" placeholder="Search products...">
                </div>
            </div>
            <div class="col-md-4">
                <select id="categoryFilter" class="form-select">
                    <option value="All">All Categories</option>
                    <!-- Dynamically populated via JS -->
                </select>
            </div>
            <div class="col-md-4">
                <select id="sortControl" class="form-select">
                    <option value="default">Sort By</option>
                    <option value="price-asc">Price: Low to High</option>
                    <option value="price-desc">Price: High to Low</option>
                    <option value="name-asc">Name: A to Z</option>
                    <option value="name-desc">Name: Z to A</option>
                </select>
            </div>
        </div>

        <!-- Products Grid Container -->
        <div class="row g-4" id="products-container">
            <!-- Dynamic Product Cards Injected Here -->
        </div>

        <!-- Pagination -->
        <div class="d-flex justify-content-between align-items-center mt-4">
            <div class="d-flex align-items-center gap-2">
                <small class="text-muted">Show:</small>
                <select id="rowsPerPage" class="form-select form-select-sm" style="width: 80px;">
                    <option value="6" selected>6</option>
                    <option value="12">12</option>
                    <option value="24">24</option>
                </select>
            </div>
            <nav><ul class="pagination pagination-sm mb-0" id="pagination"></ul></nav>
        </div>
    </div>

    <!-- Cart Offcanvas -->
    <div class="offcanvas offcanvas-end" tabindex="-1" id="cartOffcanvas" aria-labelledby="cartOffcanvasLabel">
        <div class="offcanvas-header border-bottom">
            <h5 class="offcanvas-title fw-bold" id="cartOffcanvasLabel">Your Shopping Cart</h5>
            <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Close"></button>
        </div>
        <div class="offcanvas-body d-flex flex-column">
            <div id="cartItemsContainer" class="flex-grow-1 overflow-auto mb-3">
                <p class="text-center text-muted mt-4">Your cart is empty.</p>
            </div>
            
            <div class="border-top pt-3">
                <div class="d-flex justify-content-between mb-1">
                    <span>Subtotal:</span>
                    <span id="cartSubtotal" class="fw-bold">0 EGP</span>
                </div>
                <div class="d-flex justify-content-between mb-1 text-muted small">
                    <span>Tax (14%):</span>
                    <span id="cartTax">0 EGP</span>
                </div>
                <div class="d-flex justify-content-between mb-2 text-muted small">
                    <span>Shipping:</span>
                    <span id="cartShipping">0 EGP</span>
                </div>
                <div class="d-flex justify-content-between mb-3 fs-5">
                    <strong>Final Total:</strong>
                    <strong id="cartTotal" class="text-success">0 EGP</strong>
                </div>
                <button class="btn btn-warning w-100 fw-bold" onclick="checkout()">Checkout</button>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="bg-dark text-white text-center py-3 mt-auto">
        <p class="mb-0">&copy; 2026 MiniShop. All rights reserved.</p>
    </footer>

    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<!-- Application JavaScript Logic -->
<script>
    // --- Data & State ---
    const defaultProducts = [
        { id: 1, title: "Wireless Headphones", price: 25000, category: "Electronics", description: "High-fidelity wireless sound with noise cancellation technology.", image: "https://images.unsplash.com/photo-1505740420928-5e560c06d30e?w=500&q=80" },
        { id: 2, title: "Leather Backpack", price: 8500, category: "Accessories", description: "Handcrafted genuine leather bag built for daily travel.", image: "https://images.unsplash.com/photo-1553062407-98eeb64c6a62?w=500&q=80" },
        { id: 3, title: "Smart Fitness Watch", price: 18000, category: "Electronics", description: "Track your health metrics, daily heart rate, and GPS workouts.", image: "https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=500&q=80" },
        { id: 4, title: "Classic Denim Jacket", price: 6500, category: "Clothing", description: "Comfortable and durable, timeless outerwear designed for any season.", image: "https://images.unsplash.com/photo-1576995853123-5a10305d93c0?w=500&q=80" },
        { id: 5, title: "Ergonomic Running Shoes", price: 12000, category: "Footwear", description: "Breathable and cushioned sports shoes engineered for optimal performance.", image: "https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=500&q=80" },
        { id: 6, title: "Minimalist Mechanical Watch", price: 22000, category: "Accessories", description: "Precision automatic movement with a sleek stainless steel design.", image: "https://images.unsplash.com/photo-1522335789203-aabd1fc54bc9?w=500&q=80" }
    ];

    let products = JSON.parse(localStorage.getItem('admin_products')) || defaultProducts;
    if (!localStorage.getItem('admin_products')) {
        localStorage.setItem('admin_products', JSON.stringify(defaultProducts));
    }

    let cart = JSON.parse(localStorage.getItem('cart')) || [];
    let currentPage = 1;
    let rowsPerPage = 6;

    // --- Centralized DOM Selectors ---
    const ui = {
        container: document.getElementById('products-container'),
        search: document.getElementById('searchInput'),
        category: document.getElementById('categoryFilter'),
        sort: document.getElementById('sortControl'),
        badge: document.getElementById('cart-count'),
        pagination: document.getElementById('pagination'),
        rowsPerPage: document.getElementById('rowsPerPage'),
        cartItems: document.getElementById('cartItemsContainer'),
        subtotal: document.getElementById('cartSubtotal'),
        tax: document.getElementById('cartTax'),
        shipping: document.getElementById('cartShipping'),
        total: document.getElementById('cartTotal')
    };

    // --- Product Grid Rendering ---
    function renderProducts(items) {
        if (!ui.container) return;

        if (!items.length) {
            ui.container.innerHTML = `
                <div class="col-12 text-center py-5">
                    <i class="bi bi-search display-1 text-muted"></i>
                    <p class="fs-4 text-muted mt-3">No products match your criteria.</p>
                </div>`;
            return;
        }

        ui.container.innerHTML = items.map(p => `
            <div class="col-12 col-md-6 col-lg-4 mb-4">
                <div class="card h-100 shadow-sm border-0">
                    <img src="${p.image}" class="card-img-top object-fit-cover" alt="${p.title}" style="height: 220px;">
                    <div class="card-body d-flex flex-column">
                        <div class="d-flex justify-content-between align-items-start mb-2">
                            <h5 class="card-title fw-bold mb-0 fs-6">${p.title}</h5>
                            <span class="badge bg-secondary">${p.category}</span>
                        </div>
                        <p class="card-text text-muted small flex-grow-1">${p.description || ''}</p>
                        <div class="d-flex justify-content-between align-items-center mt-3">
                            <span class="fs-5 fw-bold text-primary">${Number(p.price).toLocaleString()} EGP</span>
                            <button class="btn btn-outline-primary btn-sm" onclick="addToCart(${p.id})">
                                <i class="bi bi-cart-plus me-1"></i> Add to Cart
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        `).join('');
    }

    // --- Search, Filter, Sort & Pagination Logic ---
    function applyFilters(resetPage = true) {
        if (resetPage) currentPage = 1;

        let result = [...products];
        const search = ui.search?.value.toLowerCase().trim() || '';
        const category = ui.category?.value || 'All';
        const sort = ui.sort?.value || '';

        if (search) {
            result = result.filter(p => p.title?.toLowerCase().includes(search) || p.description?.toLowerCase().includes(search));
        }
        if (category !== 'All') {
            result = result.filter(p => p.category === category);
        }

        const sortMap = {
            'price-asc': (a, b) => Number(a.price) - Number(b.price),
            'price-desc': (a, b) => Number(b.price) - Number(a.price),
            'name-asc': (a, b) => a.title.localeCompare(b.title),
            'name-desc': (a, b) => b.title.localeCompare(a.title)
        };
        if (sortMap[sort]) result.sort(sortMap[sort]);

        const totalPages = Math.ceil(result.length / rowsPerPage) || 1;
        currentPage = Math.min(currentPage, totalPages);

        const start = (currentPage - 1) * rowsPerPage;
        renderProducts(result.slice(start, start + rowsPerPage));
        renderPagination(totalPages);
    }

    function renderPagination(totalPages) {
        if (!ui.pagination) return;
        if (totalPages <= 1) return ui.pagination.innerHTML = '';

        let html = `<li class="page-item ${currentPage === 1 ? 'disabled' : ''}">
            <button class="page-link" onclick="goToPage(${currentPage - 1})">Previous</button>
        </li>`;

        for (let i = 1; i <= totalPages; i++) {
            html += `<li class="page-item ${i === currentPage ? 'active' : ''}">
                <button class="page-link" onclick="goToPage(${i})">${i}</button>
            </li>`;
        }

        html += `<li class="page-item ${currentPage === totalPages ? 'disabled' : ''}">
            <button class="page-link" onclick="goToPage(${currentPage + 1})">Next</button>
        </li>`;

        ui.pagination.innerHTML = html;
    }

    function goToPage(page) {
        currentPage = page;
        applyFilters(false);
    }

    function populateCategories() {
        if (!ui.category) return;
        const categories = ['All', ...new Set(products.map(p => p.category).filter(Boolean))];
        ui.category.innerHTML = categories.map(c => `<option value="${c}">${c}</option>`).join('');
    }

    // --- Cart & Offcanvas Drawer Logic ---
    function addToCart(productId) {
        const product = products.find(p => p.id == productId);
        if (!product) return;

        const item = cart.find(i => i.id == productId);
        if (item) {
            item.quantity++;
        } else {
            cart.push({ ...product, quantity: 1 });
        }

        saveAndRenderCart();
    }

    function changeQuantity(productId, delta) {
        const item = cart.find(i => i.id == productId);
        if (!item) return;
        item.quantity += delta;
        if (item.quantity <= 0) return removeFromCart(productId);
        saveAndRenderCart();
    }

    function removeFromCart(productId) {
        cart = cart.filter(i => i.id != productId);
        saveAndRenderCart();
    }

    function saveAndRenderCart() {
        localStorage.setItem('cart', JSON.stringify(cart));
        
        const totalCount = cart.reduce((sum, item) => sum + item.quantity, 0);
        if (ui.badge) ui.badge.textContent = totalCount;

        if (!ui.cartItems) return;

        if (cart.length === 0) {
            ui.cartItems.innerHTML = '<p class="text-center text-muted mt-4">Your cart is empty.</p>';
            if (ui.subtotal) ui.subtotal.textContent = '0 EGP';
            if (ui.tax) ui.tax.textContent = '0 EGP';
            if (ui.shipping) ui.shipping.textContent = '0 EGP';
            if (ui.total) ui.total.textContent = '0 EGP';
            return;
        }

        let subtotal = 0;
        ui.cartItems.innerHTML = cart.map(item => {
            const itemTotal = item.price * item.quantity;
            subtotal += itemTotal;
            return `
                <div class="d-flex align-items-center gap-3 mb-3 border-bottom pb-2">
                    <img src="${item.image}" alt="${item.title}" style="width: 60px; height: 60px; object-fit: cover;" class="rounded">
                    <div class="flex-grow-1">
                        <h6 class="mb-0 text-truncate" style="max-width: 150px;">${item.title}</h6>
                        <small class="text-muted">${Number(item.price).toLocaleString()} EGP</small>
                        <div class="fw-bold mt-1">${Number(itemTotal).toLocaleString()} EGP</div>
                    </div>
                    <div class="d-flex align-items-center gap-2">
                        <button class="btn btn-sm btn-outline-secondary px-2" onclick="changeQuantity(${item.id}, -1)">-</button>
                        <span>${item.quantity}</span>
                        <button class="btn btn-sm btn-outline-secondary px-2" onclick="changeQuantity(${item.id}, 1)">+</button>
                        <button class="btn btn-sm btn-danger px-2 ms-1" onclick="removeFromCart(${item.id})"><i class="bi bi-trash"></i></button>
                    </div>
                </div>
            `;
        }).join('');

        const tax = subtotal * 0.14;
        const shipping = subtotal > 0 ? 50 : 0;
        const finalTotal = subtotal + tax + shipping;

        if (ui.subtotal) ui.subtotal.textContent = `${subtotal.toLocaleString()} EGP`;
        if (ui.tax) ui.tax.textContent = `${tax.toLocaleString()} EGP`;
        if (ui.shipping) ui.shipping.textContent = `${shipping.toLocaleString()} EGP`;
        if (ui.total) ui.total.textContent = `${finalTotal.toLocaleString()} EGP`;
    }

    function checkout() {
        if (cart.length === 0) return alert("Your cart is empty!");

        // 1. Read existing orders or default to empty array
        let orders = JSON.parse(localStorage.getItem('admin_orders')) || [];

        // 2. Push the new completed order
        const newOrder = {
            id: Date.now(),
            items: cart,
            totalItems: cart.reduce((sum, item) => sum + item.quantity, 0),
            date: new Date().toLocaleDateString()
        };
        orders.push(newOrder);

        // 3. Save updated orders list
        localStorage.setItem('admin_orders', JSON.stringify(orders));

        // 4. Empty cart in memory and localStorage
        cart = [];
        localStorage.setItem('cart', JSON.stringify([]));

        // 5. Update UI
        saveAndRenderCart();

        alert("Checkout successful! Your order has been placed.");
    }

        // --- Initialization & Listeners ---
        ui.search?.addEventListener('input', () => applyFilters(true));
        ui.category?.addEventListener('change', () => applyFilters(true));
        ui.sort?.addEventListener('change', () => applyFilters(true));
        ui.rowsPerPage?.addEventListener('change', function() {
            rowsPerPage = parseInt(this.value);
            applyFilters(true);
        });

    populateCategories();
    applyFilters(true);
    saveAndRenderCart();
</script>
</body>
</html>
